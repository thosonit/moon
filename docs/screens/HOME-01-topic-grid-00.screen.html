<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOME-01 — Topic Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Quicksand:wght@500;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --color-bg: #fff0ef;
    --color-surface: #fff9f9;
    --color-surface-alt: #ffe1e3;
    --color-text: #493434;
    --color-text-muted: #826b6a;
    --color-accent: #f8869a;
    --color-accent-strong: #db4b71;
    --color-border: #f2d7d6;

    --font-heading: "Baloo 2", "Quicksand", -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --text-heading: clamp(2.5rem, 1.8rem + 3.5vw, 4.25rem);
    --text-subheading: clamp(1.25rem, 1.1rem + 0.8vw, 1.75rem);

    --space-section: clamp(2.5rem, 2rem + 2.5vw, 6rem);
    --space-md: clamp(1rem, 0.9rem + 0.5vw, 1.5rem);
    --space-sm: 0.5rem;

    --duration-normal: 220ms;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(245, 220, 152, 0.35), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(242, 186, 222, 0.35), transparent 45%),
      linear-gradient(180deg, var(--color-bg), var(--color-surface-alt));
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.6;
  }

  header.site-header { position: relative; padding: var(--space-section) var(--space-md) var(--space-md); }

  h1.site-title { font-family: var(--font-heading); font-size: var(--text-heading); margin: 0; letter-spacing: -0.01em; color: var(--color-accent-strong); }

  .home-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-sm); }

  main { padding: 0 var(--space-md) var(--space-section); max-width: 72rem; margin: 0 auto; }

  a { color: inherit; }

  @keyframes gentle-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-4deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .topic-mascot { animation: none !important; }
  }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
    gap: var(--space-md);
  }

  .topic-card {
    position: relative;
    display: block;
    padding: var(--space-md);
    background: var(--color-surface);
    border: 2px solid var(--color-border);
    border-radius: 1.75rem;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(248, 134, 154, 0.18);
    transition: transform var(--duration-normal) var(--ease-out-expo),
      border-color var(--duration-normal) var(--ease-out-expo),
      box-shadow var(--duration-normal) var(--ease-out-expo);
  }

  .topic-card:hover,
  .topic-card:focus-visible,
  .topic-card.tv-focused {
    transform: translateY(-0.35rem) scale(1.02);
    border-color: var(--color-accent);
    box-shadow: 0 12px 28px rgba(248, 134, 154, 0.3);
    outline: none;
  }

  .topic-card:active { transform: scale(0.97); }

  .topic-mascot {
    display: inline-block;
    font-size: 2rem;
    margin-bottom: var(--space-sm);
    animation: gentle-bounce 2.4s var(--ease-out-expo) infinite;
  }

  .topic-card:hover .topic-mascot,
  .topic-card.tv-focused .topic-mascot { animation-duration: 0.8s; }

  .topic-card h2 { font-family: var(--font-heading); font-size: var(--text-subheading); margin: 0 0 var(--space-sm); color: var(--color-accent-strong); }

  .topic-card p { color: var(--color-text-muted); margin: 0; }
</style>
</head>
<body>
  <header class="site-header home-header">
    <h1 class="site-title">Lớp học của Moon - Quỳnh Như</h1>
  </header>
  <main>
    <div class="topic-grid">
      <a class="topic-card" href="#">
        <span class="topic-mascot" aria-hidden="true">🐰</span>
        <h2>Mindmap Heineman GK</h2>
        <p>70 ngày</p>
      </a>
      <a class="topic-card tv-focused" href="#">
        <span class="topic-mascot" aria-hidden="true">🐧</span>
        <h2>365 Daily English Presentations</h2>
        <p>365 ngày</p>
      </a>
    </div>
  </main>
</body>
</html>
