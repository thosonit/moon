<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ef" />
      <stop offset="1" stop-color="#ffe1e3" />
    </linearGradient>
    <mask id="crescent-cut">
      <rect width="64" height="64" fill="black" />
      <circle cx="30" cy="32" r="17" fill="white" />
      <circle cx="38" cy="25" r="15" fill="black" />
    </mask>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)" />

  <!-- sparkle -->
  <path
    d="M49 12 L50.4 15.6 L54 17 L50.4 18.4 L49 22 L47.6 18.4 L44 17 L47.6 15.6 Z"
    fill="#f2bade"
  />
  <circle cx="14" cy="46" r="1.6" fill="#f2bade" />

  <!-- crescent moon -->
  <g mask="url(#crescent-cut)">
    <circle cx="30" cy="32" r="17" fill="#f5dc98" stroke="#db4b71" stroke-width="1.4" />
  </g>

  <!-- kawaii face -->
  <g stroke="#db4b71" stroke-width="2.1" stroke-linecap="round" fill="none">
    <path d="M22 31 q2 -2.6 4 0" />
    <path d="M30 34.5 q2 -2.6 4 0" />
  </g>
  <path d="M24.5 39 q3.5 3 7 0" stroke="#db4b71" stroke-width="2" stroke-linecap="round" fill="none" />
  <ellipse cx="20.5" cy="37" rx="2.4" ry="1.6" fill="#f8869a" opacity="0.55" />
  <ellipse cx="35" cy="39.5" rx="2.4" ry="1.6" fill="#f8869a" opacity="0.55" />
</svg>
